name: build

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (with GHA cache)
        shell: bash
        run: |
          set -o pipefail
          docker buildx build \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            --progress=plain \
            --load \
            -t agent:${{ github.sha }} \
            . 2>&1 | tee /tmp/docker-build.log

      - name: Verify image
        run: docker image inspect agent:${{ github.sha }} >/dev/null

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log
          path: /tmp/docker-build.log
